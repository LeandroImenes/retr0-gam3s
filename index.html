<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" class="css">
    <title>Retr0 Gam3s</title>
</head>
<header>
    <img src="photos/logo.png" id="logo">
    <img src="photos/triforce.png" id="triforce">
</header>

<body>
    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>* Compre seus jogos</h2>
            </div>
        </div>
        <section id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
        <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>
    </main>
    <dialog id="modalCadastro">
        <h2>Novo Jogo</h2>
        <form id="formJogo">
            <label for="jogo">Nome do jogo</label>
            <input type="text" id="jogo" required>
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" required>
            <label for="desenvolvedora">Nome da equipe desenvolvedora</label>
            <input type="text" id="desenvolvedora" required>
            <label for="genero">Genero</label>
            <input type="text" id="genero" required>
            <label for="imagem">URL da imagem do jogo</label>
            <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>

</html>
